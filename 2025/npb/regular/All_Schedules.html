<<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>NPBスケジュール | Baseball Freak</title>
    <style>
        /* 1. フォントをメイリオ、サイズを12pxに設定 */
        body {
            font-family: "Meiryo", "メイリオ", sans-serif;
            font-size: 12px;
            line-height: 1.6;
            padding: 10px;
            color: #333;
        }

        /* 2. リーグカラーとデザインの適用 */
        
        /* セ・リーグ (CL) スタイル */
        .cl-schedule {
            margin-top: 20px;
            margin-bottom: 10px;
            padding: 5px 10px;
            /* 赤系のテーマカラー */
            background-color: #f7e0e0;
            border-left: 5px solid #d9534f; 
            color: #d9534f;
            font-size: 16px; 
            font-weight: bold;
        }

        /* パ・リーグ (PL) スタイル */
        .pl-schedule {
            margin-top: 30px; 
            margin-bottom: 10px;
            padding: 5px 10px;
            /* 青系のテーマカラー */
            background-color: #e0eaf7;
            border-left: 5px solid #337ab7; 
            color: #337ab7;
            font-size: 16px;
            font-weight: bold;
        }

        /* 3. iframeの縦横可変（レスポンシブ）設定 - 高さは幅の75% */
        
        /* iframeのラッパー要素：高さを幅のパーセンテージで確保 */
        .iframe-container {
            position: relative;
            width: 100%;
            /* 高さを幅の75%に設定 (前回の設定150%の半分) */
            padding-top: 75%; 
            margin-bottom: 20px;
            overflow: hidden; 
        }

        /* iframe自体：ラッパー要素内に完全に広がるように設定 */
        .schedule-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <div class="cl-schedule">セ・リーグ (CL)</div>
    <div class="iframe-container">
        <iframe class="schedule-frame" src="https://baseball-freak.github.io/BaseballFreak/2025/npb/regular/cl/schedule.html"></iframe>
    </div>

    <div class="pl-schedule">パ・リーグ (PL)</div>
    <div class="iframe-container">
        <iframe class="schedule-frame" src="https://baseball-freak.github.io/BaseballFreak/2025/npb/regular/pl/schedule.html"></iframe>
    </div>

</body>
</html>
