<<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>NPBスケジュール | Baseball Freak</title>
    <style>
        /* 1. フォントをメイリオ、サイズを12pxに設定 */
        body {
            font-family: "Meiryo", "メイリオ", sans-serif;
            font-size: 12px;
            line-height: 1.6;
            padding: 10px;
            color: #333;
        }

        /* 2. リーグカラーとデザインの適用 */
        
        /* セ・リーグ (CL) スタイル */
        .cl-schedule {
            margin-top: 20px;
            margin-bottom: 10px;
            padding: 5px 10px;
            /* 赤系のテーマカラー */
            background-color: #f7e0e0;
            border-left: 5px solid #d9534f; 
            color: #d9534f;
            font-size: 16px; 
            font-weight: bold;
        }

        /* パ・リーグ (PL) スタイル */
        .pl-schedule {
            margin-top: 30px; 
            margin-bottom: 10px;
            padding: 5px 10px;
            /* 青系のテーマカラー */
            background-color: #e0eaf7;
            border-left: 5px solid #337ab7; 
            color: #337ab7;
            font-size: 16px;
            font-weight: bold;
        }

        /* 3. iframeの設定 (幅100% + 高さ固定200px + スクロール) */
        .schedule-frame {
            width: 100%;
            /* 高さを200pxに固定 (50mm相当でコンパクトに) */
            height: 200px;
            border: 1px solid #ccc;
            display: block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div style="width: 100%; height: 80vh; overflow: hidden; border: 1px solid #ccc;">
    <iframe 
        src="https://npb.jp/games/2026/schedule_03_detail.html" 
        style="width: 100%; height: 100%; border: none;"
        allowfullscreen>
        お使いのブラウザはiframeに対応していません。
        <a href="https://npb.jp/games/2026/schedule_03_detail.html">NPB公式サイトで直接見る</a>
    </iframe>
</div>

</body>
</html>
